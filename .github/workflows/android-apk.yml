name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_TRANSLATION_ENDPOINT: ${{ vars.SHUYU_TRANSLATION_ENDPOINT }}
      EXPO_PUBLIC_TRANSLATION_PROVIDER_NAME: ${{ vars.SHUYU_TRANSLATION_PROVIDER_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test
          npm run test:translation
          npm run test:dictionary
          npm run test:translation-proxy

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache bundled TTS model
        uses: actions/cache@v5
        with:
          path: .cache/tts-models
          key: shuyu-tts-amy-medium-9a5d1fc497f85e80

      - name: Bundle verified offline voice
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:tts-model

      - name: Verify packaged Android assets
        run: npm run test:android-assets

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure APK signing
        shell: bash
        env:
          SHUYU_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHUYU_ANDROID_KEYSTORE_BASE64 }}
          SHUYU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHUYU_ANDROID_KEYSTORE_PASSWORD }}
          SHUYU_ANDROID_KEY_ALIAS: ${{ secrets.SHUYU_ANDROID_KEY_ALIAS }}
          SHUYU_ANDROID_KEY_PASSWORD: ${{ secrets.SHUYU_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$SHUYU_ANDROID_KEYSTORE_BASE64" ]]; then
            [[ -n "$SHUYU_ANDROID_KEYSTORE_PASSWORD" ]] || { echo "Missing SHUYU_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
            [[ -n "$SHUYU_ANDROID_KEY_ALIAS" ]] || { echo "Missing SHUYU_ANDROID_KEY_ALIAS"; exit 1; }
            [[ -n "$SHUYU_ANDROID_KEY_PASSWORD" ]] || { echo "Missing SHUYU_ANDROID_KEY_PASSWORD"; exit 1; }
            printf '%s' "$SHUYU_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/shuyu-release.jks
            export SHUYU_ANDROID_KEYSTORE_FILE=shuyu-release.jks
            export SHUYU_APK_SIGNING=release
            echo "SHUYU_ANDROID_KEYSTORE_FILE=shuyu-release.jks" >> "$GITHUB_ENV"
            echo "SHUYU_APK_SIGNING=release" >> "$GITHUB_ENV"
            echo "### Signing: permanent release keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            export SHUYU_APK_SIGNING=test
            echo "SHUYU_APK_SIGNING=test" >> "$GITHUB_ENV"
            echo "### Signing: test key — do not distribute publicly" >> "$GITHUB_STEP_SUMMARY"
          fi
          SHUYU_APP_VERSION=$(node -p "require('./package.json').version")
          export SHUYU_APP_VERSION
          echo "SHUYU_APP_VERSION=$SHUYU_APP_VERSION" >> "$GITHUB_ENV"
          npm run configure:android-signing

      - name: Build release APK
        working-directory: android
        env:
          SHUYU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHUYU_ANDROID_KEYSTORE_PASSWORD }}
          SHUYU_ANDROID_KEY_ALIAS: ${{ secrets.SHUYU_ANDROID_KEY_ALIAS }}
          SHUYU_ANDROID_KEY_PASSWORD: ${{ secrets.SHUYU_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Shuyu-v${SHUYU_APP_VERSION}-${SHUYU_APK_SIGNING}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Shuyu-APK
          path: Shuyu-v*.apk
          if-no-files-found: error
          retention-days: 14
